
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>방사능 바다 생존 게임</title>

  <style>
    body {
      margin: 0;
      background: #071d2b;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    canvas {
      width: min(100vw, 800px);
      height: auto;
      background: #124e62;
      border: 2px solid #789b9e;
    }
  </style>
</head>
<body>

  <canvas id="game" width="800" height="600"></canvas>

  <!-- 게임 파일 불러오기 -->
  <script src="sea.js"></script>
  <script src="ship.js"></script>
  <script src="enemy.js"></script>
  <script src="weapon.js"></script>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const keys = {};

    // 키보드 입력
    document.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      keys[key] = true;

      if (["w", "a", "s", "d"].includes(key)) {
        event.preventDefault();
      }
    });

    document.addEventListener("keyup", (event) => {
      keys[event.key.toLowerCase()] = false;
    });

    // 게임 초기화
    Sea.init();
    Ship.init();
    Enemy.init();

    // 게임 실행
    function gameLoop() {

      // 1. 배 움직임 계산
      Ship.update(keys);

      // 2. 바다 이동
      Sea.update(Ship.moveX, Ship.moveY);

      // 3. 적이 배를 추격하도록 계산
      Enemy.update(
        canvas.width / 2,
        canvas.height / 2,
        ctx,
        Ship.moveX,
        Ship.moveY
      );

      // 4. 바다 그리기
      Sea.draw(ctx);

      // 5. 적 그리기
      Enemy.draw(ctx);

      // 6. 배 그리기
      Ship.draw(ctx);

      // 다음 화면 갱신
      requestAnimationFrame(gameLoop);
    }

    gameLoop();
  </script>

</body>
</html>
